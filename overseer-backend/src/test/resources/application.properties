spring.application.name=overseer-backend-test

# ── In-memory H2 (each test class starts clean) ─────────────────────
spring.datasource.url=jdbc:h2:mem:overseer-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ── JWT — deterministic test secret (HS256 needs ≥ 256 bits) ────────
overseer.jwt.secret=test-secret-key-for-overseer-unit-and-e2e-tests-do-not-use-in-production
overseer.jwt.expiration-ms=3600000

# ── OAuth2 — stub credentials so the client registry boots ──────────
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# ── CORS / frontend ─────────────────────────────────────────────────
overseer.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173

# ── Quiet logging for test output ───────────────────────────────────
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN