name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overseer-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overseer-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ── Backend ─────────────────────────────────────────────────
  backend:
    name: Backend — unit + E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overseer-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - run: chmod +x mvnw
      # Tests boot against an in-memory H2 database (configured via
      # @E2ETestSupport on each E2E test class), so no postgres service is
      # required in CI. Unit tests use Mockito and need no infrastructure.
      - run: ./mvnw --batch-mode verify

  # ── Pixel Diff ──────────────────────────────────────────────
  pixeldiff:
    name: Pixel Diff — install & pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overseer-pixeldiff

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: overseer-pixeldiff/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile main.py
      - run: pytest -v
